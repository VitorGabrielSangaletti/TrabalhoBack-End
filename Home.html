<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <title>Burguer - Home</title>
    <link rel='stylesheet' href='cssHome.css'>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="logo-area">
                <img src='logo.jpg' class="logo-img" alt="Logo Burguer">
                <div>
                    <h1>Burguer</h1>
                    <p class="tagline">Painel de Gerenciamento</p>
                </div>
            </div>   
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-text">
                <h2>Gerencie seu<br><span>cardápio</span></h2>
                <p>Adicione, edite e remova produtos do cardápio de forma rápida e simples.</p>
                <a href="Cardapio.html" class="btn-hero">Ver Cardápio</a>
            </div>
            <div class="hero-img">
                <img src='logo.jpg' alt="Burguer">
            </div>
        </section>

        <section class="cards">
            <a href="Adicionar.html" class="card">
                <span class="card-icon">＋</span>
                <h3>Adicionar</h3>
                <p>Cadastre novos itens no cardápio</p>
            </a>
            <a href="Atualizar.html" class="card">
                <span class="card-icon">✎</span>
                <h3>Atualizar</h3>
                <p>Edite preço, nome ou descrição</p>
            </a>
            <a href="Deletar.html" class="card card-danger">
                <span class="card-icon">✕</span>
                <h3>Deletar</h3>
                <p>Remova produtos do cardápio</p>
            </a>
        </section>
    </main>
</body>
</html>
