<!DOCTYPE html>
<html>
<head>
    <title>Adicionar Produto - Burguer</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1 id="titulo">Adicionar Item</h1>
        <p>Preencha os dados do novo produto</p>

        <form action="Create.php" method="post"> 
            <div class="campo">
                <label>Nome do Produto</label>
                <input type="text" name="nome" placeholder="Ex: Cheese Bacon" required>
            </div>
            <div class="campo">
                <label>Preço (R$)</label>
                <input type="text" name="preco" placeholder="Ex: 25.90" required>
            </div>
            <div class="campo">
                <label>Descrição</label>
                <textarea name="descricao" rows="3" placeholder="Descreva o produto..."></textarea>
            </div>
            <div class="campo">
                <label>Categoria</label>
                <input type="text" name="categoria" placeholder="Ex: Hambúrgueres, Bebidas" required>
            </div>
            <div class="campo">
                <label>Disponível?</label>
                <select name="disponivel">
                    <option value="1" selected>Sim</option>
                    <option value="0">Não</option>
                </select>
            </div>
            <button type="submit">Cadastrar Produto</button>
        </form>

        <br>
        <a href="Home.html">← Voltar</a>
    </div>
</body>
</html>
